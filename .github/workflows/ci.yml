name: OpenReply launch checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-value
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openreply
      REDIS_URL: redis://localhost:6379
      INSTAGRAM_APP_ID: ci-instagram-app
      INSTAGRAM_APP_SECRET: ci-instagram-secret
      FACEBOOK_APP_SECRET: ci-facebook-secret
      WEBHOOK_VERIFY_TOKEN: ci-webhook-token
      STRIPE_SECRET_KEY: sk_test_ci_only
      STRIPE_WEBHOOK_SECRET: whsec_ci_only
      STRIPE_PRICE_PRO_MONTHLY: price_ci_monthly
      STRIPE_PRICE_PRO_ANNUAL: price_ci_annual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare deterministic CI encryption key
        run: printf 'ENCRYPTION_KEY=%064d\n' 0 >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
